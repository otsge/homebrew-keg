name: CI

on:
  # push:
  #   branches:
  #     - main
  #     - master
  #   paths:
  #     - 'Casks/**'
  pull_request:
    paths:
      - 'Casks/**'
  merge_group:
  # workflow_run:
  #   workflows: ["Triage tasks"] # Use the exact 'name' defined in your first workflow
  #   types:
  #     - completed
  workflow_dispatch:
    inputs:
      casks:
        description: List of casks to audit (comma-separated)
        required: true
      skip_install:
        description: Skip installation of casks
        required: false
        default: true
        type: boolean
      new_cask:
        description: Apply new cask audit
        required: false
        default: false
        type: boolean

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

jobs:
  generate-matrix:
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - name: Check out Pull Request
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run brew config
        run: brew config
        # run: |
        #   brew config
        #   cp /Users/runner/work/homebrew-keg/homebrew-keg/.github/workflows/files/generate-cask-ci-matrix /opt/homebrew/Library/Homebrew/dev-cmd/generate-cask-ci-matrix.rb
        #   cp /Users/runner/work/homebrew-keg/homebrew-keg/.github/workflows/files/generate-cask-ci-matrix_spec /opt/homebrew/Library/Homebrew/test/dev-cmd/generate-cask-ci-matrix_spec.rb

      - name: Generate CI matrix
        id: generate-matrix
        env:
          INPUT_CASKS: ${{ github.event.inputs.casks }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            # shellcheck disable=SC2086 # $INPUT_CASKS is a space-separated list of cask tokens
            brew generate-cask-ci-matrix ${{ github.event.inputs.skip_install && '--skip-install' }} ${{ github.event.inputs.new_cask && '--new' }} --casks $INPUT_CASKS
          elif [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]
          then
            brew generate-cask-ci-matrix --syntax-only
          else
            brew generate-cask-ci-matrix --url "$PULL_REQUEST_URL"
          fi

  test:
    name: ${{ matrix.name }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false
          stable: ${{ matrix.stable || false }}

      # setup-homebrew blanks this via $GITHUB_ENV, which overrides workflow `env:`.
      - name: Disable API installs
        run: echo 'HOMEBREW_NO_INSTALL_FROM_API=1' >> "${GITHUB_ENV}"

      - name: Enable debug mode
        run: |
          echo 'HOMEBREW_DEBUG=1' >> "${GITHUB_ENV}"
          echo 'HOMEBREW_VERBOSE=1' >> "${GITHUB_ENV}"
        if: runner.debug

      - name: Clean up CI machine
        # if: runner.os == 'macOS'
        run: brew test-bot --cleanup --only-cleanup-before

      - name: Cache Homebrew Gems
        id: cache
        uses: actions/cache@main
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Cache style cache
        if: runner.os == 'macOS'
        uses: actions/cache@main
        with:
          path: ~/Library/Caches/Homebrew/style
          key: macos-style-cache-${{ github.sha }}
          restore-keys: macos-style-cache-

      - name: Check out Pull Request
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run brew config
        run: brew config

      - name: Run brew test-bot --only-tap-syntax
        id: tap-syntax
        if: always() && !matrix.cask
        run: |
          [[ -d $(brew --repository homebrew/core) ]] && brew untap --force homebrew/core
          brew test-bot --tap '${{ matrix.tap }}' --only-tap-syntax

      - name: Run brew fetch --cask ${{ matrix.cask.token }}
        id: fetch
        run: |
          brew fetch --cask --retry --force ${{ join(matrix.fetch_args, ' ') }} '${{ matrix.tap }}/${{ matrix.cask.token }}'
        timeout-minutes: 30
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          matrix.cask

      # On xcode-27, anything that starts CoreSimulator (e.g. `brew config`) launches
      # simdiskimaged, which then unmounts or moves other disk images while re-adding a
      # duplicate watchOS runtime: "no mountable file systems" or vanishing mount points.
      # Stop it after `brew config` and before any DMG is opened.
      # TODO: remove once the xcode-27 runner image no longer needs this.
      - name: Stop simdiskimaged
        if: always() && matrix.runner == 'xcode-27' && steps.fetch.outcome == 'success'
        run: |
          sudo launchctl disable system/com.apple.CoreSimulator.simdiskimaged || true
          sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true
          sudo pkill -x simdiskimaged || true

      - name: Run brew audit --cask${{ (matrix.cask && ' ') || ' --tap ' }}${{ matrix.cask.token || matrix.tap }}
        id: audit
        run: |
          if [[ ${{ runner.os }} == "macOS" ]]
          then
            LC_ALL=C LANG=C sed -i '' 's/add_error signing_failure_message/# add_error signing_failure_message/g' "$(brew --repository)/Library/Homebrew/cask/audit.rb"
            LC_ALL=C LANG=C sed -i '' 's/return unless core_formula_names.include?(cask.token)/return/g' "$(brew --repository)/Library/Homebrew/cask/audit.rb"
            LC_ALL=C LANG=C sed -i '' 's/add_error("cask token mentions desktop/# add_error("cask token mentions desktop/g' "$(brew --repository)/Library/Homebrew/cask/audit.rb"
            LC_ALL=C LANG=C sed -i '' 's/return "#{notability_prefix}/"#{notability_prefix}/g' "$(brew --repository)/Library/Homebrew/utils/shared_audits.rb"
            LC_ALL=C LANG=C sed -i '' 's/Date.today - 30/Date.today - 0/g' "$(brew --repository)/Library/Homebrew/utils/shared_audits.rb"
            # LC_ALL=C LANG=C sed -i '' 's/return "#{tag} is a GitHub pre-release."/#return "#{tag} is a GitHub pre-release."/g' "$(brew --repository)/Library/Homebrew/utils/shared_audits.rb"
          fi
          [[ -d $(brew --repository homebrew/core) ]] && brew untap --force homebrew/core
          brew audit --cask ${{ join(matrix.audit_args, ' ') }}${{ (matrix.cask && ' $GITHUB_REPOSITORY/') || ' --tap ' }}${{ matrix.cask.token || matrix.tap }}
        timeout-minutes: 30
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          (!matrix.cask || steps.fetch.outcome == 'success') &&
          !matrix.skip_audit &&
          runner.os == 'macOS'

      - name: Gather cask information
        id: info
        env:
          CASK_PATH: ${{ matrix.cask.path }}
          TAP: ${{ matrix.tap }}
        run: |
          tap_cask_path="$(brew --repository "$TAP")/${CASK_PATH#./}"
          echo "TAP_CASK_PATH=$tap_cask_path" >> "$GITHUB_ENV"
          brew cask-ci info "$tap_cask_path"
        if: always() && steps.fetch.outcome == 'success' && matrix.cask

      - name: Uninstall conflicting formulae
        run: |
          read -r -a formula_conflicts_array <<< "$FORMULA_CONFLICTS"
          brew uninstall --formula "${formula_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.FORMULA_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Uninstall conflicting casks
        run: |
          read -r -a cask_conflicts_array <<< "$CASK_CONFLICTS"
          brew uninstall --cask "${cask_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.CASK_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Run brew uninstall --cask --force --zap ${{ matrix.cask.token }}
        run: |
          brew uninstall --cask --force --zap '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && steps.info.outcome == 'success'
        timeout-minutes: 30

      - name: Take snapshot of installed and running apps and services (macOS only)
        id: snapshot
        run: brew cask-ci snapshot
        if: always() && steps.info.outcome == 'success' && runner.os == 'macOS'

      - name: Run brew install --cask ${{ matrix.cask.token }}
        id: install
        run: brew install --cask '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: >
          always() && steps.info.outcome == 'success' &&
          fromJSON(steps.info.outputs.macos_requirement_satisfied) &&
          !matrix.skip_install
        timeout-minutes: 30

      # - name: Check for missing zap paths
      #   run: brew cask-ci zap-check "$TAP_CASK_PATH"
      #   if: >
      #     always() &&
      #     steps.install.outcome == 'success' &&
      #     runner.os == 'macOS'
      #   continue-on-error: true
      #   timeout-minutes: 10

      - name: Run brew uninstall --cask ${{ matrix.cask.token }}
        run: brew uninstall --cask '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && steps.install.outcome == 'success' && !fromJSON(steps.info.outputs.manual_installer)
        timeout-minutes: 30

      - name: Uninstall cask dependencies
        run: |
          read -r -a cask_dependencies_array <<< "$CASK_DEPENDENCIES"
          brew uninstall --cask "${cask_dependencies_array[@]}"
        if: ${{ always() && steps.install.outcome == 'success' && env.CASK_DEPENDENCIES != '' }}
        timeout-minutes: 30

      - name: Compare installed and running apps and services with snapshot (macOS only)
        run: brew cask-ci check "$TAP_CASK_PATH"
        if: always() && steps.snapshot.outcome == 'success' && steps.install.outcome == 'success' && runner.os == 'macOS'

  conclusion:
    name: conclusion
    needs: test
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Result
        run: ${{ needs.test.result == 'success' }}

      - name: Label the Pull Request
        id: label-the-pr
        if: ${{ needs.test.result == 'success' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --add-label "pr-pull" --repo "$GITHUB_REPOSITORY"
        # if: ${{ needs.test.result == 'success' && startsWith(github.head_ref, 'bump') && github.event_name == 'pull_request' }}
